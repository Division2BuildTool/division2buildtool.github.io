<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="description" content="非官方《全境封锁2》配装编辑与伤害计算工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="配装工具" />
    <title>全境封锁2配装工具</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon-app.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link href="Division2BuildTool.Web.styles.css" rel="stylesheet" />
    <script>
        // 首屏前应用字体设置，避免软件字体回退导致的闪烁
        try {
            var rawFont = localStorage.getItem("d2bt.FontInt");
            var fontIndex = rawFont === null ? 0 : JSON.parse(rawFont);
            document.documentElement.setAttribute("data-font", String(fontIndex));

            var rawLayout = localStorage.getItem("d2bt.TwoColumnLayout");
            var twoColumn = rawLayout === null ? true : JSON.parse(rawLayout);
            document.documentElement.setAttribute("data-layout", String(twoColumn) === "false" ? "single" : "two");

            var rawSize = localStorage.getItem("d2bt.FontSizeIndex");
            var sizeIndex = rawSize === null ? 0 : JSON.parse(rawSize);
            var scaleMap = { "2": "1.1", "1": "1.05", "0": "1", "-1": "0.95", "-2": "0.9" };
            document.documentElement.style.setProperty("--font-scale", scaleMap[String(sizeIndex)] || "1");
        } catch (e) { }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        页面加载出错。
        <a href="" class="reload">重新加载</a>
        <a class="dismiss">×</a>
    </div>
    <script src="js/platform.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
